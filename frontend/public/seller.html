<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seller Dashboard</title>

    <link rel="stylesheet" href="/css/home.css">
    <link rel="stylesheet" href="/css/search.css">
    <link rel="stylesheet" href="/css/signup.css">
    <link rel="stylesheet" href="/css/seller.css">
    <link rel="stylesheet" href="/css/alert.css">

</head>
<body>

    <img src="/img/loader.gif" class="loader" alt="loading">

    <div class="alert-box">
        <img src="/img/error.png" class="alert-img" alt="">
        <p class="alert-msg"></p>
    </div>

    <a href="/"><img src="/img/dark-logo.png" class="logo" alt="Clothing"></a>

    <!-- become seller -->
    <div class="become-seller hide">
        <p class="heading">become a seller</p>
        <p class="des">Sell your apparel to shoppers across the country. Apply with your business details; once
            approved you can list products, save drafts and manage your catalogue from this dashboard.</p>
        <button class="btn" id="apply-btn">apply for seller account</button>
    </div>

    <!-- apply form -->
    <div class="apply-form hide">
        <input type="text" id="business-name" placeholder="business name / company name / shop name" maxlength="120">
        <textarea id="business-add" placeholder="address" maxlength="500"></textarea>
        <textarea id="about" placeholder="about" maxlength="2000"></textarea>
        <input type="tel" id="number" placeholder="number" maxlength="15" inputmode="numeric">
        <input type="checkbox" checked class="checkbox" id="terms-and-cond">
        <label for="terms-and-cond">agree to our <a href="#">terms and conditions</a></label>
        <br>
        <input type="checkbox" checked class="checkbox" id="legitInfo">
        <label for="legitInfo">all information is legit</label>
        <button class="submit-btn" id="apply-form-btn">apply</button>
    </div>

    <!-- products list -->
    <div class="product-listing hide">
        <div class="add-product">
            <p class="add-product-title">add product</p>
            <button class="btn" id="add-product-btn">add product</button>
        </div>
        <img src="/img/no-products.png" class="no-product-image hide" alt="no products yet">

        <!-- delete confirmation -->
        <div class="delete-alert">
            <div class="alert">
                <button class="close-btn" aria-label="close"><img src="/img/close.png" alt=""></button>
                <img src="/img/delete-warning.png" class="delete-svg" alt="">
                <p class="text">are you sure ? you want to delete this product</p>
                <button class="delete-btn">delete</button>
            </div>
        </div>

        <div class="product-container"></div>
    </div>

    <script type="module" src="/js/pages/seller.js"></script>

</body>
</html>
