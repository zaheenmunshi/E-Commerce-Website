name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Audit dependencies
        run: npm audit --audit-level=high

  backend:
    name: Backend (Spring Boot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: "25"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Build and test (H2 in-memory database, no services needed)
        run: ./mvnw -B verify

  cdk:
    name: Infrastructure (CDK, Java)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cdk
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: "25"
          cache: maven
          cache-dependency-path: cdk/pom.xml
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: ./mvnw -B test
      - name: Synthesize CloudFormation (no AWS access)
        env:
          CDK_DEFAULT_REGION: ap-south-1
        run: npx --yes aws-cdk@2.1148.1 synth --quiet

  docker:
    name: Docker image
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build (not pushed)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: ecommerce:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
