name: Deploy

# Manual only: deploying creates billable AWS resources.
# One-time setup is described in cdk/README.md (EcommerceGithubOidc stack,
# secret AWS_DEPLOY_ROLE_ARN, environment "production").
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: cdk deploy Ecommerce
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: cdk
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: "25"
          cache: maven
          cache-dependency-path: cdk/pom.xml
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: AWS credentials via GitHub OIDC (no stored keys)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: github-deploy-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION || 'ap-south-1' }}
      - run: ./mvnw -B -q test
      - name: Deploy
        # values go through env (not ${{ }} inside the script) to avoid shell injection
        env:
          CDK_DEFAULT_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
          DOMAIN_NAME: ${{ vars.DOMAIN_NAME }}
          CERTIFICATE_ARN: ${{ vars.CERTIFICATE_ARN }}
          ENABLE_WAF: ${{ vars.ENABLE_WAF || 'false' }}
        run: >-
          npx --yes aws-cdk@2.1148.1 deploy Ecommerce
          --require-approval never
          -c domainName="$DOMAIN_NAME"
          -c certificateArn="$CERTIFICATE_ARN"
          -c enableWaf="$ENABLE_WAF"
