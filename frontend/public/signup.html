<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clothing : Create Account</title>

    <link rel="stylesheet" href="/css/signup.css">
    <link rel="stylesheet" href="/css/alert.css">

</head>
<body>

    <img src="/img/loader.gif" class="loader" alt="loading">

    <div class="alert-box">
        <img src="/img/error.png" class="alert-img" alt="">
        <p class="alert-msg"></p>
    </div>

    <div class="container">
        <a href="/"><img src="/img/dark-logo.png" class="logo" alt="Clothing"></a>
        <div>
            <input type="text" autocomplete="name" id="name" placeholder="name" maxlength="100">
            <input type="email" autocomplete="email" id="email" placeholder="email" maxlength="254">
            <input type="password" autocomplete="new-password" id="password" placeholder="password (min 8 characters)" maxlength="72">
            <input type="tel" autocomplete="tel" id="number" placeholder="number" maxlength="15" inputmode="numeric">
            <input type="checkbox" checked class="checkbox" id="terms-and-cond">
            <label for="terms-and-cond">agree to our <a href="#">terms and conditions</a></label>
            <br>
            <input type="checkbox" class="checkbox" id="notification">
            <label for="notification">receive upcoming offers and events mails</label>
            <button class="submit-btn">create account</button>
        </div>
        <a href="/oauth2/authorization/google" class="link oauth-link" data-provider="google" hidden>continue with google</a>
        <a href="/login" class="link">already have an account? Log in here</a>
    </div>

    <script type="module" src="/js/pages/signup.js"></script>

</body>
</html>
