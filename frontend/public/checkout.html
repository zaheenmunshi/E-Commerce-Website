<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clothing : Checkout</title>

    <link rel="stylesheet" href="/css/signup.css">
    <link rel="stylesheet" href="/css/home.css">
    <link rel="stylesheet" href="/css/cart.css">
    <link rel="stylesheet" href="/css/checkout.css">
    <link rel="stylesheet" href="/css/alert.css">

</head>
<body>

    <nav class="navbar"></nav>

    <img src="/img/loader.gif" class="loader" alt="loading">

    <div class="alert-box">
        <img src="/img/error.png" class="alert-img" alt="">
        <p class="alert-msg"></p>
    </div>

    <div class="form">
        <h1 class="heading">checkout</h1>
        <p class="text">delivery address</p>
        <input type="text" id="address" placeholder="address" maxlength="200" autocomplete="address-line1">
        <input type="text" id="street" placeholder="street" maxlength="200" autocomplete="address-line2">
        <div class="three-input-container">
            <input type="text" id="city" placeholder="city" maxlength="100" autocomplete="address-level2">
            <input type="text" id="state" placeholder="state" maxlength="100" autocomplete="address-level1">
            <input type="text" id="pincode" placeholder="pin code" maxlength="6" inputmode="numeric" autocomplete="postal-code">
        </div>
        <input type="text" id="landmark" placeholder="land mark" maxlength="200">
    </div>

    <div class="cart-section">
        <div class="product-list">
            <p class="section-heading">your cart</p>
            <div class="cart"></div>
        </div>
        <div class="checkout-section">
            <div class="checkout-box">
                <p class="text">your total bill,</p>
                <h1 class="bill">$0</h1>
                <button class="place-order-btn">place order</button>
            </div>
        </div>
    </div>

    <script type="module" src="/js/pages/checkout.js"></script>

</body>
</html>
