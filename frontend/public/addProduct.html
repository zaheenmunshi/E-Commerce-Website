<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clothing : Add Product</title>

    <link rel="stylesheet" href="/css/signup.css">
    <link rel="stylesheet" href="/css/addProduct.css">
    <link rel="stylesheet" href="/css/alert.css">

</head>
<body>

    <img src="/img/loader.gif" class="loader" alt="loading">

    <div class="alert-box">
        <img src="/img/error.png" class="alert-img" alt="">
        <p class="alert-msg"></p>
    </div>

    <a href="/seller"><img src="/img/dark-logo.png" class="logo" alt="back to seller dashboard"></a>

    <div class="form">
        <input type="text" id="product-name" placeholder="product name" maxlength="120">
        <input type="text" id="short-des" placeholder="short line about the product (10 to 100 letters)" maxlength="100">
        <textarea id="des" placeholder="detail description" maxlength="5000"></textarea>

        <!-- product image -->
        <div class="product-info">
            <div class="product-image"><p class="text">product image</p></div>
            <div class="upload-image-sec">
                <p class="text"><img src="/img/camera.png" alt="">upload image</p>
                <div class="upload-catalouge">
                    <input type="file" class="fileupload" id="first-file-upload-btn" accept="image/jpeg,image/png,image/gif,image/webp" hidden>
                    <label for="first-file-upload-btn" class="upload-image"></label>
                    <input type="file" class="fileupload" id="second-file-upload-btn" accept="image/jpeg,image/png,image/gif,image/webp" hidden>
                    <label for="second-file-upload-btn" class="upload-image"></label>
                    <input type="file" class="fileupload" id="third-file-upload-btn" accept="image/jpeg,image/png,image/gif,image/webp" hidden>
                    <label for="third-file-upload-btn" class="upload-image"></label>
                    <input type="file" class="fileupload" id="fourth-file-upload-btn" accept="image/jpeg,image/png,image/gif,image/webp" hidden>
                    <label for="fourth-file-upload-btn" class="upload-image"></label>
                </div>
            </div>
            <div class="select-sizes">
                <p class="text">size available</p>
                <div class="sizes">
                    <input type="checkbox" class="size-checkbox" id="xs" value="xs">
                    <input type="checkbox" class="size-checkbox" id="s" value="s">
                    <input type="checkbox" class="size-checkbox" id="m" value="m">
                    <input type="checkbox" class="size-checkbox" id="l" value="l">
                    <input type="checkbox" class="size-checkbox" id="xl" value="xl">
                    <input type="checkbox" class="size-checkbox" id="xxl" value="xxl">
                    <input type="checkbox" class="size-checkbox" id="xxxl" value="xxxl">
                </div>
            </div>
        </div>

        <div class="product-price">
            <input type="number" id="actual-price" placeholder="actual price" min="0.01" step="0.01">
            <input type="number" id="discount" placeholder="discount percentage" min="0" max="100" step="1">
            <input type="number" id="sell-price" placeholder="selling price" min="0" step="0.01">
        </div>

        <input type="number" id="stock" min="20" step="1" placeholder="items in stock (minimum 20)">

        <textarea id="tags" maxlength="900" placeholder="Enter categories here, for example - Men, Jeans, Blue Jeans, Rough jeans (you should add men or women at start)"></textarea>

        <input type="checkbox" class="checkbox" id="tac" checked>
        <label for="tac">clothing takes 30% from your total sell</label>

        <div class="buttons">
            <button class="btn" id="add-btn">add product</button>
            <button class="btn" id="save-btn">save draft</button>
        </div>
    </div>

    <script type="module" src="/js/pages/add-product.js"></script>

</body>
</html>
